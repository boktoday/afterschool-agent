  <line x1="895" y1="170" x2="935" y2="170" stroke="rgba(255,255,255,.12)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- chat bubbles -->
  <rect x="845" y="205" width="180" height="32" rx="14" fill="rgba(217,164,65,.08)"/>
  <rect x="895" y="245" width="140" height="32" rx="14" fill="rgba(24,37,51,.8)"/>
  <rect x="845" y="295" width="200" height="38" rx="14" fill="rgba(217,164,65,.08)"/>
  <rect x="880" y="345" width="155" height="32" rx="14" fill="rgba(24,37,51,.8)"/>
  <rect x="845" y="395" width="220" height="42" rx="14" fill="rgba(217,164,65,.08)"/>
