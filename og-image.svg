  <!-- gold glow -->
  <ellipse cx="900" cy="315" rx="300" ry="300" fill="rgba(217,164,65,.06)"/>
  <!-- phone mock outline -->
  <rect x="830" y="140" width="280" height="340" rx="28" fill="none" stroke="rgba(217,164,65,.15)" stroke-width="1"/>
  <rect x="830" y="140" width="280" height="50" rx="28" fill="rgba(217,164,65,.04)"/>
  <circle cx="865" cy="165" r="16" fill="rgba(217,164,65,.15)"/>
