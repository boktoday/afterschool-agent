  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- stars -->
  <circle cx="100" cy="80" r="1.5" fill="rgba(255,255,255,.6)"/>
  <circle cx="350" cy="120" r="1" fill="rgba(255,255,255,.4)"/>
  <circle cx="800" cy="60" r="2" fill="rgba(255,255,255,.5)"/>
  <circle cx="1050" cy="100" r="1.5" fill="rgba(255,255,255,.3)"/>
