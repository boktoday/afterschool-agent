      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="50%" stop-color="#131a2e"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#e8c87a"/>
