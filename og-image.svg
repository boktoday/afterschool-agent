  <text x="80" y="340" font-family="system-ui,sans-serif" font-size="18" fill="rgba(246,239,227,.5)" letter-spacing="3" text-transform="uppercase">IN A WORLD FULL OF AI AGENTS</text>
  <text x="80" y="370" font-family="system-ui,sans-serif" font-size="18" fill="rgba(246,239,227,.5)" letter-spacing="3" text-transform="uppercase">WE GIVE YOUNG PEOPLE AGENCY</text>
